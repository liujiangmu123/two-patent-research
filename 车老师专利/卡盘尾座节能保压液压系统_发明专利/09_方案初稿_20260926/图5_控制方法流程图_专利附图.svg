<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="349.4mm" viewBox="0 0 1020 1200"><rect x="0" y="0" width="1020" height="1200" fill="white"/><rect x="340" y="20" width="220" height="50" rx="0" fill="white" stroke="black" stroke-width="2.2"/>
<text x="450.0" y="52.0" font-family="SimSun, Songti SC, serif" font-size="20" text-anchor="middle">开始</text>
<line x1="450" y1="70" x2="450" y2="100" stroke="black" stroke-width="1.8"/>
<polygon points="450,100 455.0,90.0 445.0,90.0" fill="black" stroke="black" stroke-width="1"/>
<rect x="220" y="100" width="460" height="70" rx="0" fill="white" stroke="black" stroke-width="2.2"/>
<text x="450.0" y="142.0" font-family="SimSun, Songti SC, serif" font-size="20" text-anchor="middle">S1 卡盘夹紧，确认卡盘压力 p ≥ p_min(n)</text>
<line x1="450" y1="170" x2="450" y2="200" stroke="black" stroke-width="1.8"/>
<polygon points="450,200 455.0,190.0 445.0,190.0" fill="black" stroke="black" stroke-width="1"/>
<rect x="220" y="200" width="460" height="90" rx="0" fill="white" stroke="black" stroke-width="2.2"/>
<text x="450.0" y="239.0" font-family="SimSun, Songti SC, serif" font-size="20" text-anchor="middle">S2 尾座前进顶紧；有杆腔预压 p2 = p_pre，</text>
<text x="450.0" y="265.0" font-family="SimSun, Songti SC, serif" font-size="20" text-anchor="middle">无杆腔 p1 = (F0 + p2·A2)/A1</text>
<line x1="450" y1="290" x2="450" y2="320" stroke="black" stroke-width="1.8"/>
<polygon points="450,320 455.0,310.0 445.0,310.0" fill="black" stroke="black" stroke-width="1"/>
<rect x="220" y="320" width="460" height="70" rx="0" fill="white" stroke="black" stroke-width="2.2"/>
<text x="450.0" y="349.15" font-family="SimSun, Songti SC, serif" font-size="19" text-anchor="middle">S3 关闭锁闭座阀19、20，换向阀回中位，</text>
<text x="450.0" y="374.15" font-family="SimSun, Songti SC, serif" font-size="19" text-anchor="middle">泵停机或卸荷</text>
<line x1="450" y1="390" x2="450" y2="420" stroke="black" stroke-width="1.8"/>
<polygon points="450,420 455.0,410.0 445.0,410.0" fill="black" stroke="black" stroke-width="1"/>
<rect x="220" y="420" width="460" height="60" rx="0" fill="white" stroke="black" stroke-width="2.2"/>
<text x="450.0" y="457.0" font-family="SimSun, Songti SC, serif" font-size="20" text-anchor="middle">S4 计算推力 F = p1·A1 − p2·A2</text>
<line x1="450" y1="480" x2="450" y2="510" stroke="black" stroke-width="1.8"/>
<polygon points="450,510 455.0,500.0 445.0,500.0" fill="black" stroke="black" stroke-width="1"/>
<polyline points="450,510.0 600.0,575 450,640.0 300.0,575 450,510.0" fill="white" stroke="black" stroke-width="2.2"/>
<text x="450" y="570.0" font-family="SimSun, Songti SC, serif" font-size="20" text-anchor="middle">F 与 [F_L, F_H]</text>
<text x="450" y="594.0" font-family="SimSun, Songti SC, serif" font-size="20" text-anchor="middle">比较</text>
<polyline points="300,575 120,575 120,650" fill="none" stroke="black" stroke-width="2.2"/>
<polygon points="120,660 114,648 126,648" fill="black" stroke="black" stroke-width="1"/>
<text x="200" y="562" font-family="Arial" font-size="18" text-anchor="middle">F &lt; F_L</text>
<rect x="20" y="660" width="200" height="90" rx="0" fill="white" stroke="black" stroke-width="2.2"/>
<text x="120.0" y="699.15" font-family="SimSun, Songti SC, serif" font-size="19" text-anchor="middle">S5 短时开启19</text>
<text x="120.0" y="724.15" font-family="SimSun, Songti SC, serif" font-size="19" text-anchor="middle">从蓄能器补压至F0</text>
<polyline points="600,575 780,575 780,650" fill="none" stroke="black" stroke-width="2.2"/>
<polygon points="780,660 774,648 786,648" fill="black" stroke="black" stroke-width="1"/>
<text x="700" y="562" font-family="Arial" font-size="18" text-anchor="middle">F &gt; F_H</text>
<rect x="660" y="660" width="240" height="90" rx="0" fill="white" stroke="black" stroke-width="2.2"/>
<text x="780.0" y="699.15" font-family="SimSun, Songti SC, serif" font-size="19" text-anchor="middle">S6 短时开启21微泄至F0，</text>
<text x="780.0" y="724.15" font-family="SimSun, Songti SC, serif" font-size="19" text-anchor="middle">累计热伸长 ΔL</text>
<line x1="450" y1="640" x2="450" y2="800" stroke="black" stroke-width="1.8"/>
<polygon points="450,800 455.0,790.0 445.0,790.0" fill="black" stroke="black" stroke-width="1"/>
<text x="520" y="700" font-family="Arial" font-size="18" text-anchor="middle">F_L ≤ F ≤ F_H</text>
<polyline points="120,750 120,780 390,780" fill="none" stroke="black" stroke-width="1.8"/>
<line x1="390" y1="780" x2="448" y2="780" stroke="black" stroke-width="1.8"/>
<polygon points="448,780 438.0,775.0 438.0,785.0" fill="black" stroke="black" stroke-width="1"/>
<polyline points="780,750 780,780 510,780" fill="none" stroke="black" stroke-width="1.8"/>
<line x1="510" y1="780" x2="452" y2="780" stroke="black" stroke-width="1.8"/>
<polygon points="452,780 462.0,785.0 462.0,775.0" fill="black" stroke="black" stroke-width="1"/>
<polyline points="450,805.0 580.0,860 450,915.0 320.0,860 450,805.0" fill="white" stroke="black" stroke-width="2.2"/>
<text x="450" y="867.0" font-family="SimSun, Songti SC, serif" font-size="20" text-anchor="middle">S7 加工结束？</text>
<polyline points="580,860 960,860 960,450" fill="none" stroke="black" stroke-width="1.8"/>
<line x1="960" y1="450" x2="682" y2="450" stroke="black" stroke-width="1.8"/>
<polygon points="682,450 692.0,455.0 692.0,445.0" fill="black" stroke="black" stroke-width="1"/>
<text x="990" y="660" font-family="SimSun, Songti SC, serif" font-size="20" text-anchor="middle">否</text>
<line x1="450" y1="915" x2="450" y2="960" stroke="black" stroke-width="1.8"/>
<polygon points="450,960 455.0,950.0 445.0,950.0" fill="black" stroke="black" stroke-width="1"/>
<text x="472" y="945" font-family="SimSun, Songti SC, serif" font-size="20" text-anchor="middle">是</text>
<rect x="220" y="960" width="460" height="70" rx="0" fill="white" stroke="black" stroke-width="2.2"/>
<text x="450.0" y="1002.0" font-family="SimSun, Songti SC, serif" font-size="20" text-anchor="middle">S8 尾座后退到位确认后，卡盘松开</text>
<line x1="450" y1="1030" x2="450" y2="1060" stroke="black" stroke-width="1.8"/>
<polygon points="450,1060 455.0,1050.0 445.0,1050.0" fill="black" stroke="black" stroke-width="1"/>
<rect x="340" y="1060" width="220" height="50" rx="0" fill="white" stroke="black" stroke-width="2.2"/>
<text x="450.0" y="1092.0" font-family="SimSun, Songti SC, serif" font-size="20" text-anchor="middle">结束</text>
<text x="450" y="1170" font-family="SimSun, Songti SC, serif" font-size="40" text-anchor="middle">图5</text></svg>